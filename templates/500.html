<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Ошибка сервера - 8B4T</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="stars"></div>
    <div class="twinkling"></div>
    
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="{{ url_for('index') }}" class="logo-link">
                    <span class="logo-text">8B4T</span>
                </a>
            </div>
            <div class="nav-links">
                <a href="{{ url_for('index') }}" class="nav-link">Главная</a>
                {% if session.user_id %}
                    <a href="{{ url_for('dashboard') }}" class="nav-link">Панель</a>
                    <a href="{{ url_for('logout') }}" class="nav-link">Выход</a>
                {% else %}
                    <a href="{{ url_for('login') }}" class="nav-link">Вход</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="error-main">
        <div class="error-container">
            <div class="error-content">
                <div class="error-code">500</div>
                <h1 class="error-title">Ошибка сервера</h1>
                <p class="error-description">
                    Произошла внутренняя ошибка сервера. Наши инженеры уже работают над её устранением.
                </p>
                <div class="error-actions">
                    <a href="{{ url_for('index') }}" class="btn btn-primary">Вернуться на главную</a>
                    <button onclick="location.reload()" class="btn btn-secondary">Обновить страницу</button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
